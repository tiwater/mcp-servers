name: Publish Shared Runtimes

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish-dotnet:
    name: Publish .NET Global Tools
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Login to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: hughlyu

      - name: Pack and Publish tiwater-xlsx
        run: |
          cd packages/xlsx-cli
          dotnet pack -c Release -o ./nupkg
          dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://www.nuget.org/api/v2/package --skip-duplicate

      - name: Pack and Publish tiwater-docx
        run: |
          cd packages/docx-cli
          dotnet pack -c Release -o ./nupkg
          dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://www.nuget.org/api/v2/package --skip-duplicate

      - name: Pack and Publish tiwater-pptx
        run: |
          cd packages/pptx-cli
          dotnet pack -c Release -o ./nupkg
          dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://www.nuget.org/api/v2/package --skip-duplicate

      - name: Pack and Publish tiwater-convert
        run: |
          cd packages/convert-cli
          dotnet pack -c Release -o ./nupkg
          dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://www.nuget.org/api/v2/package --skip-duplicate

      - name: Verify tools are installable from NuGet V3
        shell: bash
        run: |
          set -euo pipefail
          verify_tool() {
            local project="$1"
            local package version destination
            package="$(sed -n 's:.*<PackageId>\\(.*\\)</PackageId>.*:\1:p' "$project" | head -n 1)"
            version="$(sed -n 's:.*<Version>\\(.*\\)</Version>.*:\1:p' "$project" | head -n 1)"
            test -n "$package"
            test -n "$version"
            destination="$(mktemp -d)"
            for attempt in $(seq 1 20); do
              if dotnet tool install "$package" --version "$version" --tool-path "$destination" --add-source https://api.nuget.org/v3/index.json; then
                return 0
              fi
              if [ "$attempt" = 20 ]; then
                echo "NuGet V3 did not make $package $version installable within 300 seconds" >&2
                return 1
              fi
              sleep 15
            done
          }
          verify_tool packages/xlsx-cli/xlsx.csproj
          verify_tool packages/docx-cli/docx.csproj
          verify_tool packages/pptx-cli/pptx.csproj
          verify_tool packages/convert-cli/convert.csproj

  publish-python:
    name: Publish Python Runtime (tiwater-pdf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build and Publish tiwater-pdf
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd packages/pdf-cli
          python -m build
          twine upload dist/* --skip-existing
