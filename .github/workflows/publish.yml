name: Publish Shared Runtimes

# Release authority and operator rules are defined in RELEASING.md.
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: publish-shared-runtimes
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release-gate:
    name: Require main release authority
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main release refs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Published packages must come from refs/heads/main; got ${GITHUB_REF}." >&2
            exit 1
          fi

  publish-dotnet:
    name: Publish .NET Global Tools
    needs: release-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse every version-controlled JSON file
        run: python scripts/validate_json.py --tracked

      - name: Login to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: hughlyu

      - name: Pack and Publish tiwater-xlsx
        run: |
          cd packages/xlsx-cli
          dotnet pack -c Release -o ./nupkg
          python ../../scripts/validate_json.py --archives-from ./nupkg
          dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://www.nuget.org/api/v2/package --skip-duplicate

      - name: Pack and Publish tiwater-docx
        run: |
          cd packages/docx-cli
          dotnet pack -c Release -o ./nupkg
          python ../../scripts/validate_json.py --archives-from ./nupkg
          dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://www.nuget.org/api/v2/package --skip-duplicate

      - name: Pack and Publish tiwater-pptx
        run: |
          cd packages/pptx-cli
          dotnet pack -c Release -o ./nupkg
          python ../../scripts/validate_json.py --archives-from ./nupkg
          dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://www.nuget.org/api/v2/package --skip-duplicate

      - name: Pack and Publish tiwater-convert
        run: |
          cd packages/convert-cli
          dotnet pack -c Release -o ./nupkg
          python ../../scripts/validate_json.py --archives-from ./nupkg
          dotnet nuget push ./nupkg/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://www.nuget.org/api/v2/package --skip-duplicate

      - name: Verify tools are installable from NuGet V3
        shell: bash
        run: |
          set -euo pipefail
          verify_tool() {
            local project="$1"
            local package version destination
            package="$(sed -n 's:.*<PackageId>\(.*\)</PackageId>.*:\1:p' "$project" | head -n 1)"
            version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$project" | head -n 1)"
            test -n "$package"
            test -n "$version"
            destination="$(mktemp -d)"
            for attempt in $(seq 1 120); do
              if dotnet tool install "$package" --version "$version" --tool-path "$destination" --add-source https://api.nuget.org/v3/index.json --no-http-cache; then
                return 0
              fi
              if [ "$attempt" = 120 ]; then
                echo "NuGet V3 did not make $package $version installable within 1800 seconds" >&2
                return 1
              fi
              sleep 15
            done
          }
          verify_tool packages/xlsx-cli/xlsx.csproj
          verify_tool packages/docx-cli/docx.csproj
          verify_tool packages/pptx-cli/pptx.csproj
          verify_tool packages/convert-cli/convert.csproj

  publish-python:
    name: Publish Python Runtime (tiwater-pdf)
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Parse every version-controlled JSON file
        run: python scripts/validate_json.py --tracked

      - name: Build and Publish tiwater-pdf
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd packages/pdf-cli
          python -m build
          python ../../scripts/validate_json.py --archives-from ./dist
          twine upload dist/* --skip-existing

  publish-office-mcp:
    name: Publish Office MCP
    needs: release-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Use npm client with provenance support
        run: npm install --global npm@11.11.0

      - name: Install fixed PDF runtime for contract smoke
        run: python -m pip install ./packages/pdf-cli

      - name: Verify package and server contract
        run: |
          npm --prefix servers ci
          npm run generate:pdf-contracts
          git diff --exit-code -- servers/pdf/contracts
          npm run release:boundary
          npm run release:pdf-boundary
          npm pack ./servers --dry-run

      - name: Publish Office MCP
        working-directory: servers
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if npm view "@tiwater/office-mcp@${package_version}" version >/dev/null 2>&1; then
            echo "@tiwater/office-mcp ${package_version} is already published"
          else
            npm publish --provenance --access public
          fi
