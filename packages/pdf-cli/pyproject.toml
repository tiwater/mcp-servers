[project]
name = "tiwater-pdf"
version = "0.21.8"
description = "PDF inspection and table extraction CLI"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.0",
    "openai",
    "socksio>=1.0.0",
]

[project.scripts]
tiwater-pdf = "tiwater_pdf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist.force-include]
"../format-evidence/contracts" = "tiwater_pdf/contracts"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]
